<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#242426" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <style>html { background: #1c1c1e; color-scheme: dark; } body { margin: 0; background: inherit; }</style>
    <script>
      try {
        const saved = JSON.parse(localStorage.getItem('st_pro_data_v2'));
        const deviceLight = window.matchMedia?.('(prefers-color-scheme: light)').matches;
        const light = saved?.theme === 'light' || (saved?.theme === 'system' && deviceLight);
        document.documentElement.style.colorScheme = light ? 'light' : 'dark';
        document.documentElement.style.backgroundColor = light ? '#f5f5f7' : '#1c1c1e';
      } catch {}
    </script>
    <title>ApexFinance</title>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
